# Life Events Library (30+ event types) with half-life decay parameters
# Reference: 技术设计文档 §4.6 EventEngine, config/l_model.yaml events.random_library
# impact_decay_model: exponential_half_life -> impact(t) = impact_0 * 0.5^(t/half_life)

events:
